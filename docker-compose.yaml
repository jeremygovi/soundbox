services:
  soundbox:
    build:
      context: .
    image: soundbox:local
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATA_DIR: /data
      MAX_SOUND_SIZE_MB: ${MAX_SOUND_SIZE_MB:-10}
    volumes:
      - ./data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
